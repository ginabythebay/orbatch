[project]
name = "review"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "click>=8.5",
    "markdown-it-py>=3.0",
    "orbit",
]

[dependency-groups]
dev = [
    "portability",
]

[project.scripts]
review-diff = "review.cli:main"
review-html = "review.html:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
